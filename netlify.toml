[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Redirection du sous-domaine Netlify vers le domaine principal
[[redirects]]
  from = "https://meenstore.netlify.app/*"
  to = "https://meeniye.com/:splat"
  status = 301
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
